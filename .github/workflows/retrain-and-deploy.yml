name: Retrain and Deploy ML Model

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Source that triggered retraining (e.g. backend_completion, manual)'
        required: false
        default: 'manual'
      event_name:
        description: 'UFC Event Name'
        required: false
        default: 'Manual/Scheduled Trigger'
      force_retrain:
        description: 'Force retraining even if no new fights are detected'
        type: boolean
        required: false
        default: false
      sync_kaggle_only:
        description: 'Skip VPS retrain and immediately sync current dataset to Kaggle'
        type: boolean
        required: false
        default: false
  schedule:
    # Run Sunday and Monday mornings at 06:00 UTC (after Saturday UFC events finish)
    - cron: '0 6 * * 0,1'

concurrency:
  group: ufc-ml-retrain
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain-and-deploy:
    name: Retrain & Deploy on Oracle VPS
    if: ${{ !inputs.sync_kaggle_only }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Oracle VPS and execute pipeline
        uses: appleboy/ssh-action@v1.0.3
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'schedule' }}
          EVENT_NAME: ${{ inputs.event_name || 'Scheduled/API' }}
          FORCE_RETRAIN: ${{ inputs.force_retrain || false }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'Vali-Hameed' }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'valihameed88@gmail.com' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TRIGGER_SOURCE,EVENT_NAME,FORCE_RETRAIN,GH_TOKEN,GIT_AUTHOR_NAME,GIT_AUTHOR_EMAIL
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo "  UFC ML Auto-Retrain & Deploy Pipeline"
            echo "  Trigger Source : ${TRIGGER_SOURCE}"
            echo "  Event Name     : ${EVENT_NAME}"
            echo "  Force Retrain  : ${FORCE_RETRAIN}"
            echo "=========================================================="

            cd /home/ubuntu/UFC-Fight-Predictor

            echo "--- Synchronizing repository with main branch ---"
            git config --global --add safe.directory /home/ubuntu/UFC-Fight-Predictor
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            echo "--- Activating Python Virtual Environment ---"
            source venv/bin/activate
            pip install -r requirements.txt

            echo "--- Scraping new UFC event data via Playwright container ---"
            docker run --rm \
              -e PYTHONUNBUFFERED=1 \
              -v /home/ubuntu/UFC-Fight-Predictor/app:/app \
              -w /app \
              mcr.microsoft.com/playwright/python:v1.42.0-jammy \
              bash -c "pip install --no-cache-dir --disable-pip-version-check --root-user-action=ignore -q playwright==1.42.0 beautifulsoup4 pandas && python3 -u update_dataset.py"

            sudo chown -R $(id -u):$(id -g) /home/ubuntu/UFC-Fight-Predictor/app

            # Check if ufc-master.csv has changed
            HAS_CHANGES=$(git status --porcelain app/ufc-master.csv || true)

            if [ -n "$HAS_CHANGES" ] || [ "${FORCE_RETRAIN}" = "true" ]; then
              echo ">>> New event data detected or force retrain requested. Starting retraining..."
              python app/model.py
              echo ">>> Model training finished successfully."

              echo "--- Committing updated dataset and model to Git ---"
              git config user.name "${GIT_AUTHOR_NAME}"
              git config user.email "${GIT_AUTHOR_EMAIL}"

              git add app/ufc-master.csv app/ufc_gradient_boosting_model.pkl app/ufc_other_artifacts.pkl
              if ! git diff --cached --quiet; then
                git commit -m "[skip ci] Auto-update dataset and model after completed event (${EVENT_NAME})"
                echo "--- Pushing updated dataset and model to GitHub ---"
                git push "https://x-access-token:${GH_TOKEN}@github.com/Vali-Hameed/UFC-Fight-Predictor.git" HEAD:main
              else
                echo "No changes staged to commit."
              fi

              echo "--- Rebuilding & restarting Docker container ---"
              docker compose up -d --build

              echo "--- Verifying API health ---"
              sleep 5
              curl -f http://localhost:8000/health || (echo "Health check failed!" && exit 1)
              echo ">>> Pipeline completed successfully. Container is live with new model!"
            else
              echo ">>> Dataset is already up to date. No new fights found to train on."
            fi

  update-kaggle:
    name: Sync Dataset to Kaggle
    needs: retrain-and-deploy
    runs-on: ubuntu-latest
    if: always() && (needs.retrain-and-deploy.result == 'success' || needs.retrain-and-deploy.result == 'skipped')
    steps:
      - name: Check Kaggle credentials
        id: kaggle-check
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ] || [ -n "$KAGGLE_KEY" ] || ([ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]); then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "Kaggle secrets configured. Proceeding with Kaggle sync."
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Kaggle credentials not found in repository secrets. Skipping Kaggle sync."
          fi

      - name: Checkout latest main
        if: steps.kaggle-check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5

      - name: Check if dataset was updated recently
        id: change-check
        if: steps.kaggle-check.outputs.enabled == 'true'
        run: |
          # If the last commit touched ufc-master.csv or force_retrain / sync_kaggle_only is true
          LAST_COMMIT_DIFF=$(git diff --name-only HEAD~1 HEAD | grep "app/ufc-master.csv" || true)
          FORCE="${{ inputs.force_retrain || false }}"
          KAGGLE_ONLY="${{ inputs.sync_kaggle_only || false }}"

          if [ -n "$LAST_COMMIT_DIFF" ] || [ "$FORCE" = "true" ] || [ "$KAGGLE_ONLY" = "true" ]; then
            echo "should_upload=true" >> $GITHUB_OUTPUT
            echo "Dataset changed or force/kaggle-only upload enabled."
          else
            echo "should_upload=false" >> $GITHUB_OUTPUT
            echo "No recent dataset changes detected. Skipping upload to Kaggle."
          fi

      - name: Set up Python
        if: steps.kaggle-check.outputs.enabled == 'true' && steps.change-check.outputs.should_upload == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Kaggle CLI
        if: steps.kaggle-check.outputs.enabled == 'true' && steps.change-check.outputs.should_upload == 'true'
        run: pip install kaggle

      - name: Upload new version to Kaggle
        if: steps.kaggle-check.outputs.enabled == 'true' && steps.change-check.outputs.should_upload == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_DATASET_ID: ${{ secrets.KAGGLE_DATASET_ID || vars.KAGGLE_DATASET_ID || 'valihameed/ufc-fight-data' }}
        run: |
          echo "Setting up Kaggle credentials..."
          mkdir -p ~/.kaggle

          # Configure token for modern Kaggle CLI (Option A: env var, Option B: access_token file)
          TOKEN="${KAGGLE_API_TOKEN:-$KAGGLE_KEY}"
          if [ -n "$TOKEN" ]; then
            export KAGGLE_API_TOKEN="$TOKEN"
            echo "$TOKEN" > ~/.kaggle/access_token
          fi

          # Also configure legacy ~/.kaggle/kaggle.json if username and key are provided
          if [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            cat <<EOF > ~/.kaggle/kaggle.json
          {
            "username": "${KAGGLE_USERNAME}",
            "key": "${KAGGLE_KEY}"
          }
          EOF
          fi

          chmod 700 ~/.kaggle
          [ -f ~/.kaggle/access_token ] && chmod 600 ~/.kaggle/access_token
          [ -f ~/.kaggle/kaggle.json ] && chmod 600 ~/.kaggle/kaggle.json

          echo "Packaging dataset for Kaggle upload..."
          mkdir -p kaggle_pkg
          cp app/ufc-master.csv kaggle_pkg/

          cat <<EOF > kaggle_pkg/dataset-metadata.json
          {
            "title": "UFC Fight Data Master Dataset",
            "id": "${KAGGLE_DATASET_ID}",
            "licenses": [
              {
                "name": "CC0-1.0"
              }
            ]
          }
          EOF

          echo "Publishing new dataset version to Kaggle (${KAGGLE_DATASET_ID})..."
          kaggle datasets version -p kaggle_pkg -m "Auto-update after completed UFC event (${{ inputs.event_name || 'automated' }})" --dir-mode zip || echo "Kaggle upload failed or dataset not found. Verify KAGGLE_DATASET_ID in Kaggle."

